        body {

        .bg-gradient {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(ellipse at 15% 25%, rgba(120, 50, 200, 0.2) 0%, transparent 50%),
                radial-gradient(ellipse at 85% 75%, rgba(50, 100, 200, 0.2) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(200, 50, 100, 0.15) 0%, transparent 50%);
            animation: bgPulse 10s ease-in-out infinite; pointer-events: none; z-index: 0;
        }
        @keyframes bgPulse {
            0%, 100% { opacity: 0.6; transform: scale(1) rotate(0deg); }
            33% { opacity: 1; transform: scale(1.1) rotate(2deg); }
            66% { opacity: 0.8; transform: scale(0.95) rotate(-2deg); }
        }
        .particles {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 1;
        }
        .particle {
            position: absolute; width: 4px; height: 4px;
            background: rgba(255, 255, 255, 0.6); border-radius: 50%;
            animation: float 15s infinite;
        }
        .particle:nth-child(1) { left: 10%; top: 20%; animation-duration: 12s; }
        .particle:nth-child(2) { left: 20%; top: 60%; animation-duration: 18s; }
        .particle:nth-child(3) { left: 35%; top: 40%; animation-duration: 14s; }
        .particle:nth-child(4) { left: 50%; top: 80%; animation-duration: 16s; }
        .particle:nth-child(5) { left: 65%; top: 30%; animation-duration: 20s; }
        .particle:nth-child(6) { left: 80%; top: 70%; animation-duration: 13s; }
        .particle:nth-child(7) { left: 90%; top: 50%; animation-duration: 17s; }
        .particle:nth-child(8) { left: 15%; top: 85%; animation-duration: 19s; }
        .particle:nth-child(9) { left: 45%; top: 15%; animation-duration: 15s; }
        .particle:nth-child(10) { left: 75%; top: 90%; animation-duration: 21s; }
        .particle:nth-child(11) { left: 30%; top: 75%; animation-duration: 14s; }
        .particle:nth-child(12) { left: 60%; top: 25%; animation-duration: 16s; }
        .particle:nth-child(13) { left: 55%; top: 10%; animation-duration: 13s; }
        .particle:nth-child(14) { left: 40%; top: 90%; animation-duration: 17s; }
        .particle:nth-child(15) { left: 85%; top: 40%; animation-duration: 15s; }
        .particle:nth-child(16) { left: 70%; top: 5%; animation-duration: 14s; }
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.6; }
            25% { transform: translate(20px, -30px) scale(1.2); opacity: 1; }
            50% { transform: translate(-15px, 20px) scale(0.8); opacity: 0.4; }
            75% { transform: translate(25px, 15px) scale(1.1); opacity: 0.8; }
        }
        .mouse-glow {
            position: fixed; width: 500px; height: 500px; border-radius: 50%;
            background: radial-gradient(circle, rgba(100, 200, 255, 0.12) 0%, transparent 70%);
            pointer-events: none; z-index: 2; transform: translate(-50%, -50%);
        }
        .container {
            position: relative; width: 100%; min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            padding: 50px 20px; z-index: 10; perspective: 1000px;
        }
        .portal {
            position: absolute; border-radius: 15px;
            background: linear-gradient(145deg, #0a0a0a, #1a1a1a);
            border: 1px solid rgba(255, 255, 255, 0.1); overflow: hidden;
            transition: all 0.6s cubic-bezier(0.19, 1, 0.22, 1);
            cursor: pointer; text-decoration: none; display: block;
            animation: floating 6s ease-in-out infinite;
        }
        @keyframes floating {
            0%, 100% { transform: translateY(0px) rotate(var(--rotation)); }
            50% { transform: translateY(-20px) rotate(var(--rotation)); }
        }
        .portal:hover {
            z-index: 100; border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), 0 0 60px rgba(100, 200, 255, 0.3);
            animation-play-state: paused;
        }
        
        /* MERKEZ - 9 NUMARA (TAM ORTADA, FLOATİNG İLE) */

            --rotation: 0deg;
            z-index: 50;
        }
        
        /* ÜST SOL BÖLGE */
        .portal:nth-child(1) { width: 200px; height: 270px; top: 8%; left: 8%; --rotation: -8deg; animation-delay: 0.3s; }
        .portal:nth-child(4) { width: 210px; height: 280px; top: 5%; left: 28%; --rotation: -5deg; animation-delay: 0.6s; }

        /* ORTA SAĞ */

        .portal:nth-child(12) { width: 195px; height: 265px; top: 45%; right: 3%; left: auto; --rotation: 8deg; animation-delay: 2.7s; }
        
        /* ALT SOL BÖLGE */

        .portal:nth-child(8) { width: 190px; height: 260px; bottom: 12%; right: 26%; left: auto; --rotation: 7deg; animation-delay: 3.6s; }
        .portal:nth-child(13) { width: 195px; height: 265px; bottom: 6%; right: 6%; left: auto; --rotation: 9deg; animation-delay: 3.9s; }
        
        /* Hover Renkler */
        .portal:nth-child(1):hover { box-shadow: 0 30px 80px rgba(255, 80, 100, 0.4); }
        .portal:nth-child(2):hover { box-shadow: 0 30px 80px rgba(80, 255, 120, 0.4); }
        .portal:nth-child(3):hover { box-shadow: 0 30px 80px rgba(80, 150, 255, 0.4); }
        .portal:nth-child(4):hover { box-shadow: 0 30px 80px rgba(255, 220, 80, 0.4); }
        .portal:nth-child(5):hover { box-shadow: 0 30px 80px rgba(255, 80, 220, 0.4); }
        .portal:nth-child(6):hover { box-shadow: 0 30px 80px rgba(80, 255, 230, 0.4); }
        .portal:nth-child(7):hover { box-shadow: 0 30px 80px rgba(255, 150, 80, 0.4); }
        .portal:nth-child(8):hover { box-shadow: 0 30px 80px rgba(150, 100, 255, 0.4); }

        .portal:nth-child(13):hover { box-shadow: 0 30px 80px rgba(100, 255, 180, 0.4); }
        .portal:nth-child(14):hover { box-shadow: 0 30px 80px rgba(255, 120, 200, 0.4); }
        
        .portal-thumbnail {
            width: 100%; height: 100%; object-fit: cover; opacity: 0.5;
            transition: all 0.6s ease; filter: grayscale(50%) contrast(1.1);
        }
        .portal:hover .portal-thumbnail {
            opacity: 1; filter: grayscale(0%) contrast(1.3); transform: scale(1.15);
        }
        .play-icon {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 80px; height: 80px; background: rgba(255, 0, 0, 0.95);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            pointer-events: none; z-index: 5; transition: all 0.4s cubic-bezier(0.19, 1, 0.22, 1);
            box-shadow: 0 8px 30px rgba(255, 0, 0, 0.6);
        }
        .portal:hover .play-icon {
            transform: translate(-50%, -50%) scale(1.3);
            box-shadow: 0 15px 50px rgba(255, 0, 0, 0.8);
        }
        .play-icon::before {
            content: ''; border-left: 26px solid #fff;
            border-top: 16px solid transparent; border-bottom: 16px solid transparent;
            margin-left: 8px;
        }
        .video-number {
            position: absolute; top: 12px; left: 12px; font-size: 16px;
            font-weight: bold; color: rgba(255, 255, 255, 0.8);
            background: rgba(0, 0, 0, 0.7); padding: 6px 12px;
            border-radius: 8px; backdrop-filter: blur(10px); z-index: 5;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .video-title {
            position: absolute; bottom: 0; left: 0; width: 100%;
            padding: 25px 15px; background: linear-gradient(to top, rgba(0,0,0,0.95), transparent);
            color: #fff; font-size: 13px; font-weight: bold; text-align: center;
            transform: translateY(100%); transition: transform 0.5s cubic-bezier(0.19, 1, 0.22, 1);
            z-index: 5; letter-spacing: 1px;
        }
        .portal:hover .video-title { transform: translateY(0); }
        .page-title {
            position: fixed; top: 50px; left: 50%; transform: translateX(-50%);
            font-size: 28px; font-weight: bold; color: #fff; letter-spacing: 12px;
            text-transform: uppercase; z-index: 100; text-align: center;
            opacity: 0.9; text-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
        }
        .sound-wave {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 100px; height: 100px; pointer-events: none; z-index: 6;
            opacity: 0; transition: opacity 0.3s ease;
        }
        .portal:hover .sound-wave { opacity: 1; }
        .sound-wave span {
            position: absolute; width: 3px; height: 20px;
            background: rgba(255, 255, 255, 0.8); border-radius: 2px;
            animation: soundWave 0.5s ease-in-out infinite;
        }
        .sound-wave span:nth-child(1) { left: 20%; animation-delay: 0s; }
        .sound-wave span:nth-child(2) { left: 35%; animation-delay: 0.1s; }
        .sound-wave span:nth-child(3) { left: 50%; animation-delay: 0.2s; }
        .sound-wave span:nth-child(4) { left: 65%; animation-delay: 0.1s; }
        .sound-wave span:nth-child(5) { left: 80%; animation-delay: 0s; }
        @keyframes soundWave {
            0%, 100% { height: 20px; }
            50% { height: 50px; }
        }

            .mouse-glow { display: none; }
            .page-title { font-size: 18px; letter-spacing: 4px; }
            .sound-wave { display: none; }
        }

        .portal:nth-child(14) { animation-delay: 1.3s, 2.1s; }
        @keyframes fadeInScale {
            from { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }

    <div class="sound-control" id="soundControl" onclick="toggleSound()">
        <svg id="soundIcon" viewBox="0 0 24 24">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
        </svg>
    </div>
    <div class="version-info">© 2026 ÖNCESİ // VOID PORTFOLIO</div>

    <script>
        let audioContext = null;
        let soundEnabled = true;

        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playHoverSound() {
            if (!soundEnabled) return;
            initAudio();
            if (audioContext.state === 'running') {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(1200, audioContext.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.03, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.15);
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.15);
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const control = document.getElementById('soundControl');
            const icon = document.getElementById('soundIcon');
            if (soundEnabled) {
                control.classList.remove('muted');
                icon.innerHTML = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
            } else {
                control.classList.add('muted');
                icon.innerHTML = '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>';
            }
        }

        const mouseGlow = document.getElementById('mouseGlow');
        document.addEventListener('mousemove', (e) => {
            mouseGlow.style.left = e.clientX + 'px';
            mouseGlow.style.top = e.clientY + 'px';
        });

        let hoverTimeout = null;
        document.querySelectorAll('.portal').forEach(portal => {
            portal.addEventListener('mouseenter', () => {
                document.querySelectorAll('.portal').forEach(p => {
                    if (p !== portal) { p.style.opacity = '0.5'; p.style.filter = 'blur(2px)'; }
                });
                hoverTimeout = setTimeout(() => { playHoverSound(); }, 50);
            });
            portal.addEventListener('mouseleave', () => {
                clearTimeout(hoverTimeout);
                document.querySelectorAll('.portal').forEach(p => {
                    p.style.opacity = '1'; p.style.filter = 'blur(0)';
                });
            });
            portal.addEventListener('mousemove', (e) => {
                if (window.innerWidth <= 768) return;
                const rect = portal.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                const rotateX = (y - centerY) / 10;
                const rotateY = (centerX - x) / 10;
                portal.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.05)`;
            });
            portal.addEventListener('mouseleave', () => {
                if (window.innerWidth <= 768) return;
                portal.style.transform = `perspective(1000px) rotateX(0) rotateY(0) scale(1)`;
            });
        });

        window.addEventListener('load', () => {
            document.body.style.opacity = '0';
            setTimeout(() => {
                document.body.style.transition = 'opacity 0.8s ease';
                document.body.style.opacity = '1';
            }, 100);
        });

        document.addEventListener('click', () => {
            initAudio();
            if (audioContext && audioContext.state === 'suspended') {
                audioContext.resume();
            }
        }, { once: true });
    </script>
