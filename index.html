<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VOID // PORTFOLIO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300&family=Orbitron:wght@900&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; position: fixed; }
        body { position: relative; background: #000000; }

        .particles {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 1;
        }

        .particle {
            position: absolute; width: 2px; height: 2px;
            background: rgba(0, 255, 255, 0.6); border-radius: 50%;
            animation: float 15s infinite;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translate(100px, -100px) scale(0); opacity: 0; }
        }

        .section-before {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000000;
            clip-path: polygon(0 0, 100% 0, 0 100%);
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: all 0.6s ease; z-index: 10;
        }

        .section-before:hover { background: #0a0a0a; }

        .section-before .content {
            color: #FFFFFF; text-align: center; padding: 40px;
            transform: translate(-15vw, -15vh);
        }

        .section-before .title {
            font-family: 'Inter', sans-serif; font-size: 56px;
            font-weight: 300; letter-spacing: 12px; text-transform: uppercase;
        }

        .section-after {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #FFFFFF;
            clip-path: polygon(100% 0, 100% 100%, 0 100%);
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: all 0.6s ease; z-index: 5; overflow: hidden;
        }

        .section-after::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(0, 0, 0, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 0, 0, 0.03) 1px, transparent 1px);
            background-size: 40px 40px; opacity: 0; transition: opacity 0.5s ease;
        }

        .section-after:hover::before { opacity: 1; }
        .section-after:hover {
            background: #f8f8f8;
            box-shadow: inset 0 0 100px rgba(0, 255, 255, 0.1);
        }

        .section-after .content {
            color: #000000; text-align: center; padding: 40px;
            position: relative; z-index: 10; transform: translate(15vw, 15vh);
        }

        .section-after .title {
            font-family: 'Orbitron', sans-serif; font-size: 56px;
            font-weight: 900; letter-spacing: 8px; text-transform: uppercase;
            position: relative; display: inline-block;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            transition: text-shadow 0.3s ease;
        }

        .section-after:hover .title {
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.5), 0 0 40px rgba(0, 255, 255, 0.3);
        }

        .section-after .title::before,
        .section-after .title::after {
            content: '2026 SONRASI'; position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; opacity: 0;
        }

        .section-after:hover .title::before {
            opacity: 0.5; color: #00ffff; animation: glitch1 0.3s infinite;
        }

        .section-after:hover .title::after {
            opacity: 0.5; color: #ff00ff; animation: glitch2 0.3s infinite;
        }

        @keyframes glitch1 {
            0%, 100% { transform: translate(0); }
            25% { transform: translate(-2px, 2px); }
            50% { transform: translate(2px, -2px); }
            75% { transform: translate(-2px, -2px); }
        }

        @keyframes glitch2 {
            0%, 100% { transform: translate(0); }
            25% { transform: translate(2px, -2px); }
            50% { transform: translate(-2px, 2px); }
            75% { transform: translate(2px, 2px); }
        }

        .loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000000; display: flex; justify-content: center;
            align-items: center; z-index: 9999; transition: opacity 0.8s ease;
        }

        .loader.hidden { opacity: 0; pointer-events: none; }

        .loader-text {
            font-family: 'Orbitron', sans-serif; font-size: 18px;
            letter-spacing: 10px; color: #FFFFFF; text-transform: uppercase;
            animation: loaderPulse 2s ease-in-out infinite;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }

        @keyframes loaderPulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        @media (max-width: 768px) {
            .section-before { clip-path: polygon(0 0, 100% 0, 100% 50%, 0 50%); }
            .section-before .content { transform: translate(0, -25%); padding: 20px; }
            .section-after { clip-path: polygon(0 50%, 100% 50%, 100% 100%, 0 100%); }
            .section-after .content { transform: translate(0, 25%); padding: 20px; }
            .section-before .title, .section-after .title { font-size: 32px; letter-spacing: 6px; }
            .loader-text { font-size: 14px; letter-spacing: 5px; }
        }

        @media (max-width: 480px) {
            .section-before .title, .section-after .title { font-size: 26px; letter-spacing: 4px; }
            .section-before .content, .section-after .content { transform: translate(0, -20%); }
            .section-after .content { transform: translate(0, 20%); }
        }
    </style>
</head>
<body>
    <div class="loader" id="loader">
        <div class="loader-text">SEÇİMİNİ YAP</div>
    </div>

    <div class="particles" id="particles"></div>

    <div class="section-before" onclick="navigateTo('2026-oncesi.html')">
        <div class="content">
            <div class="title">2026 ÖNCESİ</div>
        </div>
    </div>

    <div class="section-after" onclick="navigateTo('2026-sonrasi.html')">
        <div class="content">
            <div class="title">2026 SONRASI</div>
        </div>
    </div>

    <script>
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (10 + Math.random() * 10) + 's';
                container.appendChild(particle);
            }
        }

        window.addEventListener('load', () => {
            createParticles();
            setTimeout(() => {
                document.getElementById('loader').classList.add('hidden');
            }, 2000);
        });

        function navigateTo(url) {
            document.body.style.transition = 'opacity 0.5s ease';
            document.body.style.opacity = '0';
            setTimeout(() => { window.location.href = url; }, 500);
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === '1' || e.key === 'ArrowUp') {
                navigateTo('portfolio-2026-oncesi.html');
            } else if (e.key === '2' || e.key === 'ArrowDown') {
                navigateTo('portfolio-2026-plus-final-v2.html');
            }
        });

        let touchStartY = 0;
        document.addEventListener('touchstart', (e) => { touchStartY = e.touches[0].clientY; });
        document.addEventListener('touchend', (e) => {
            const diff = touchStartY - e.changedTouches[0].clientY;
            if (Math.abs(diff) > 100 && window.innerWidth <= 768) {
                navigateTo(diff > 0 ? 'portfolio-2026-oncesi.html' : 'portfolio-2026-plus-final-v2.html');
            }
        });
    </script>
</body>
</html>
